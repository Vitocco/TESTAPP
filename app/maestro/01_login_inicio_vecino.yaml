# 1) Login vecina -> Inicio -> Finanzas -> "Rendición octubre"
appId: com.example.appjuntavecinos
---
- launchApp:
    clearState: true
    permissions:
      all: allow                  # evita los diálogos de notificaciones y red local
- runFlow:
    file: comun/login.yaml
    env:
      EMAIL: "camila@zaror.cl"
- extendedWaitUntil:
    visible: "Hola,"
    timeout: 20000
- extendedWaitUntil:
    visible: "Saldo de la junta.*"
    timeout: 20000
- waitForAnimationToEnd

- tapOn: "Finanzas"               # pestaña inferior
- extendedWaitUntil:
    visible: "Finanzas\\."        # título con el punto terracota
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Rendición octubre"
    direction: DOWN
    timeout: 20000
- tapOn: "Rendición octubre"
- extendedWaitUntil:
    visible: "Saldo del período"
    timeout: 15000
- waitForAnimationToEnd
