# 2) Sigue con la sesión de Camila del flujo 01 (sin clearState).
#    Solicitar arriendo -> Patio y quincho -> día libre -> 15:00 a 19:00
#    -> "Asado vecinal" -> 25 personas -> Enviar -> Reservas
appId: com.example.appjuntavecinos
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Hola,"
    timeout: 20000
- waitForAnimationToEnd

- tapOn: "Solicitar arriendo de la sede"
- extendedWaitUntil:
    visible: "Elige la sede"
    timeout: 15000
- tapOn: "Patio · 40"             # miniatura "Patio · <capacidad>"
- extendedWaitUntil:
    visible: "Patio y quincho\\."
    timeout: 10000
- waitForAnimationToEnd           # carga la disponibilidad del mes

# Día libre: hoy + 5 días (la semilla solo ocupa el Patio el 22 nov)
- evalScript: ${output.dia = String(new Date(Date.now() + 5 * 24 * 60 * 60 * 1000).getDate())}
- tapOn: ${output.dia}

- tapOn:
    text: "--:--"                 # "Desde"
    index: 0
- tapOn: "15:00"
- tapOn: "--:--"                  # "Hasta" (ya es el único vacío)
- tapOn: "19:00"

- tapOn: "Ej: cumpleaños"         # placeholder de "Motivo"
- inputText: "Asado vecinal"
- tapOn: "máx. 40"                # placeholder de "Personas"
- inputText: "25"
- hideKeyboard
- scrollUntilVisible:
    element: "Enviar solicitud"
    direction: DOWN
- tapOn: "Enviar solicitud"
- extendedWaitUntil:
    visible: "Solicitud enviada.*"
    timeout: 15000

- tapOn: "Reservas"               # pestaña inferior
- extendedWaitUntil:
    visible: "Mis reservas\\."
    timeout: 15000
- extendedWaitUntil:
    visible: "Asado vecinal"
    timeout: 15000
- waitForAnimationToEnd
