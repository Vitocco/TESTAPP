# Subflujo: inicia sesión con ${EMAIL} y la contraseña de prueba 1234.
# Se usa desde los otros flujos con runFlow + env.
appId: com.example.appjuntavecinos
---
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 20000
- tapOn: "nombre@correo.com"      # placeholder del campo "Correo electrónico"
- inputText: ${EMAIL}
- tapOn: "Tu contraseña"          # placeholder del campo "Contraseña"
- inputText: "1234"
- hideKeyboard                    # con el teclado abierto "Entrar" queda tapado
- tapOn: "Entrar"
