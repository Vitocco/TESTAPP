# 0) Demo completa en UNA ejecución (~60 s) para el video:
#    Camila solicita arriendo -> Directiva aprueba -> Camila ve métodos de pago y el
#    resumen de Webpay (sin pagar) -> Tesorera registra un gasto.
#    Requiere los datos recién reiniciados (ver README).
appId: com.example.appjuntavecinos
---
# ---------- 1. Camila: Inicio -> Finanzas -> Solicitar arriendo -> Reservas ----------
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    file: comun/login.yaml
    env:
      EMAIL: "camila@zaror.cl"
- extendedWaitUntil:
    visible: "Saldo de la junta.*"
    timeout: 20000
- waitForAnimationToEnd           # que se vea el saldo

- tapOn: "Finanzas"
- extendedWaitUntil:
    visible: "Finanzas\\."
    timeout: 15000
- waitForAnimationToEnd

- tapOn: "Inicio"
- extendedWaitUntil:
    visible: "Solicitar arriendo de la sede"
    timeout: 15000
- tapOn: "Solicitar arriendo de la sede"
- extendedWaitUntil:
    visible: "Elige la sede"
    timeout: 15000
- tapOn: "Patio · 40"
- extendedWaitUntil:
    visible: "Patio y quincho\\."
    timeout: 10000
- waitForAnimationToEnd           # disponibilidad del mes
# Día libre: hoy + 5 días (la semilla solo ocupa el Patio el 22 nov)
- evalScript: ${output.dia = String(new Date(Date.now() + 5 * 24 * 60 * 60 * 1000).getDate())}
- tapOn: ${output.dia}
- tapOn:
    text: "--:--"                 # "Desde"
    index: 0
- tapOn: "15:00"
- tapOn: "--:--" # "Hasta"
- tapOn: "19:00"
- tapOn: "Ej: cumpleaños"
- inputText: "Asado vecinal"
- hideKeyboard                    # el teclado tapa el campo "Personas"
- scrollUntilVisible:
    element: "máx. 40"
    direction: DOWN
- tapOn: "máx. 40"
- inputText: "25"
- hideKeyboard
- scrollUntilVisible:
    element: "Enviar solicitud"
    direction: DOWN
- tapOn: "Enviar solicitud"
- extendedWaitUntil:
    visible: "Solicitud enviada.*"
    timeout: 15000

- tapOn: "Reservas"
- extendedWaitUntil:
    visible: "Asado vecinal"
    timeout: 15000
- waitForAnimationToEnd

# ---------- 2. Directiva: aprueba con observación -> Calendario -> Patio y quincho ----------
- runFlow: comun/logout.yaml
- runFlow:
    file: comun/login.yaml
    env:
      EMAIL: "directiva@zaror.cl"
- extendedWaitUntil:
    visible: "Solicitudes"
    timeout: 20000
- tapOn: "Solicitudes"
- extendedWaitUntil:
    visible: ".*Asado vecinal"            # "Camila Rojas · Asado vecinal"
    timeout: 15000
- waitForAnimationToEnd                   # la lista se acomoda al cargar; tocar antes falla
- tapOn:
    text: "Aprobar"
    below: ".*Asado vecinal"
- extendedWaitUntil:
    visible: "Aprobar solicitud"
    timeout: 10000
- tapOn: "Ej: Dejar el espacio limpio"
- inputText: "Aprobada, dejar el quincho limpio"
- tapOn:
    text: "Aprobar"
    rightOf: "Volver"
- extendedWaitUntil:
    notVisible: "Aprobar solicitud"
    timeout: 15000

- tapOn: "Calendario"
- extendedWaitUntil:
    visible: "Sedes y calendario\\."
    timeout: 15000
- scrollUntilVisible:
    element: "Patio y quincho"
    direction: DOWN
- tapOn: "Patio y quincho"
- extendedWaitUntil:
    visible: "Patio y quincho\\."
    timeout: 15000
- waitForAnimationToEnd           # que se vea el día ocupado
- back                            # el detalle no tiene barra inferior (falta "Perfil")

# ---------- 3. Camila: Reservas -> Pagar -> métodos -> Webpay -> resumen -> Volver ----------
- runFlow: comun/logout.yaml
- runFlow:
    file: comun/login.yaml
    env:
      EMAIL: "camila@zaror.cl"
- extendedWaitUntil:
    visible: "Hola,"
    timeout: 20000
- tapOn: "Reservas"
- extendedWaitUntil:
    visible: "Pagar .*"
    timeout: 15000
- tapOn: "Pagar .*"
- extendedWaitUntil:
    visible: "¿Cómo quieres pagar.*"
    timeout: 10000
- waitForAnimationToEnd           # que se vean los métodos
- tapOn: "Webpay"
- extendedWaitUntil:
    visible: "Ir a pagar"
    timeout: 10000
- waitForAnimationToEnd           # que se vea el resumen
- back                            # Volver sin pagar

# ---------- 4. Tesorera: Gasto -> Guardar -> Movimientos -> Pagos ----------
- runFlow: comun/logout.yaml
- runFlow:
    file: comun/login.yaml
    env:
      EMAIL: "tesorero@zaror.cl"
- extendedWaitUntil:
    visible: "Gasto"
    timeout: 20000
- tapOn: "Gasto"
- extendedWaitUntil:
    visible: "Materiales"         # categorías cargadas
    timeout: 15000
- tapOn: "0" # placeholder de "Monto (CLP)"
- inputText: "12990"
- tapOn: "Materiales"
- tapOn: "Ej: boleta de luz"
- inputText: "Ampolletas para la sede"
- hideKeyboard
- scrollUntilVisible:
    element: "Guardar movimiento"
    direction: DOWN
- tapOn: "Guardar movimiento"
- extendedWaitUntil:
    visible: "Movimiento guardado"
    timeout: 20000

- tapOn: "Movimientos"
- extendedWaitUntil:
    visible: "Ampolletas para la sede"
    timeout: 15000
- waitForAnimationToEnd

- tapOn: "Pagos"
- extendedWaitUntil:
    visible: "Pagos de reservas\\."
    timeout: 15000
- waitForAnimationToEnd
